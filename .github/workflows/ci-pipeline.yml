
name: BSIT3 Automated CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      # Stage 1: Checkout Source Code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Stage 2: Build and Environment Setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies and Linter
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Run Linter
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # Stage 3: Automated Unit Testing
      - name: Run Automated Unit Tests
        run: pytest -v

      # Stage 4: Packaging and Artifact Generation
      - name: Package Application
        run: |
          zip -r app-build-${{ github.sha }}.zip calculator.py test_calculator.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: app-build-*.zip
